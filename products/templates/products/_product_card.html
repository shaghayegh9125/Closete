{% load i18n %}
{% load humanize %}
{% load persian_translation_tags %}

<article class="product-card">
    <a class="product-media" href="{{ product.get_absolute_url }}">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.title }}">
        {% else %}
            <div class="product-media-empty">بدون تصویر</div>
        {% endif %}
    </a>
    <div class="product-body">
        <h3><a href="{{ product.get_absolute_url }}">{{ product.title }}</a></h3>
        <div class="price">{{ product.price|intcomma:False|translate_number }} {% translate '$' %}</div>
        <form action="{% url 'cart:cart_add' product.id %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="btn btn-primary btn-full btn-small">
                {% trans 'Add to Cart' %}
            </button>
        </form>
    </div>
</article>
