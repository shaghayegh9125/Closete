{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block page_title %}ورود · کمد هوشمند{% endblock %}

{% block content %}
<div class="container auth-shell">
    <div class="auth-card">
        <p class="eyebrow">Account</p>
        <h1>ورود</h1>
        <p>برای ثبت نظر و تکمیل سفارش وارد شوید.</p>
        <form action="" method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <input type="submit" value="ورود">
        </form>
        <div class="auth-switch">
            حساب ندارید؟ <a href="{% url 'account_signup' %}">ثبت‌نام</a>
        </div>
    </div>
</div>
{% endblock %}
